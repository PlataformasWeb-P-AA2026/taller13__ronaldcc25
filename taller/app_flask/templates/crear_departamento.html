{% extends "index.html" %}
{% block content %}
<h2>Registro de Departamento</h2>
<div class="formulario-basico">
    <form action="/crear/departamento" method="POST">
        <label>Propietario:</label>
        <input type="text" name="nombre_propietario" required>
        
        <label>Costo del Inmueble:</label>
        <input type="number" step="0.01" name="costo" required>
        
        <label>Número de Cuartos:</label>
        <input type="number" name="num_cuartos" required>
        
        <label>Edificio Correspondiente:</label>
        <select name="edificio" required>
            {% for e in edificios %}
            <option value="{{ e.url }}">{{ e.nombre }}</option>
            {% endfor %}
        </select>
        
        <button type="submit" class="boton-enviar">Guardar</button>
    </form>
</div>
{% endblock %}
