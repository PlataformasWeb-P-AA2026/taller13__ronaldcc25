{% extends "index.html" %}
{% block content %}
<h2>Listado de Departamentos</h2>
<p>Total de departamentos: <strong>{{ numero }}</strong></p>

<table class="tabla-datos">
  <thead>
    <tr>
      <th>Nombre Propietario</th>
      <th>Costo</th>
      <th>Cuartos</th>
      <th>Edificio</th>
    </tr>
  </thead>
  <tbody>
    {% for d in departamentos %}
    <tr>
      <td>{{ d.nombre_propietario }}</td>
      <td>${{ d.costo }}</td>
      <td>{{ d.num_cuartos }}</td>
      <td>{{ d.edificio }}</td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
